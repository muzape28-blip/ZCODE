<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ZCODE Editor</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050806;
            overflow: hidden;
        }
        #editor {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            font-family: 'monospace';
            font-size: 12px;
            background-color: #050806 !important;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #050806;
        }
        ::-webkit-scrollbar-thumb {
            background: #1B4D2E;
            border-radius: 2px;
        }
        .ace_gutter {
            background: #0A100D !important;
            color: #4D7A5A !important;
            border-right: 1px solid #111612 !important;
        }
        .ace_editor {
            background-color: #050806 !important;
        }
        .ace_scroller {
            background-color: #050806 !important;
        }
    </style>
</head>
<body>
    <div id="editor"></div>
    <script src="ace/ace.js"></script>
    <script>
        var editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/python");
        editor.session.setUseWorker(false);

        editor.setOptions({
            fontSize: "12px",
            showPrintMargin: false,
            showGutter: true,
            highlightActiveLine: true,
            wrap: true,
            cursorStyle: "line"
        });

        var isSettingValue = false;
        editor.on("change", function() {
            if (!isSettingValue && window.ZCODE) {
                window.ZCODE.onCodeChange(editor.getValue());
            }
        });

        function setCode(code) {
            isSettingValue = true;
            editor.setValue(code, -1);
            isSettingValue = false;
        }

        function getCode() {
            return editor.getValue();
        }

        function insertText(text) {
            editor.insert(text);
            editor.focus();
        }

        function undo() {
            editor.undo();
        }

        function redo() {
            editor.redo();
        }
    </script>
</body>
</html>
