<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ZCODE Editor</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050806;
            overflow: hidden;
        }
        #editor {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            font-family: 'monospace';
            font-size: 12px;
            background-color: #050806 !important;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #050806; }
        ::-webkit-scrollbar-thumb { background: #1B4D2E; border-radius: 2px; }
        .ace_gutter {
            background: #0A100D !important;
            color: #4D7A5A !important;
            border-right: 1px solid #111612 !important;
            width: 40px !important;
        }
        .ace_editor { background-color: #050806 !important; }
        .ace_scroller { background-color: #050806 !important; }
        .ace_active-line { background: rgba(27,77,46,0.12) !important; }
        .ace_cursor { color: #39FF14 !important; }
        /* Fix WebView focus */
        .ace_text-input {
            opacity: 0 !important;
            left: 0 !important;
            top: 0 !important;
            width: 100% !important;
        }
    </style>
</head>
<body>
<div id="editor"></div>
<script src="ace/ace.js"></script>
<script src="ace/mode-python.js"></script>
<script src="ace/theme-tomorrow_night_eighties.js"></script>
<script>
var editor = ace.edit("editor");
editor.setTheme("ace/theme/tomorrow_night_eighties");
editor.session.setMode("ace/mode/python");
editor.session.setUseWorker(false);
editor.setOptions({
    fontSize: "12px",
    showPrintMargin: false,
    showGutter: true,
    highlightActiveLine: true,
    wrap: true,
    cursorStyle: "line",
    tabSize: 4,
    useSoftTabs: true,
    animatedScroll: false,
    enableBasicAutocompletion: false,
    enableLiveAutocompletion: false,
    scrollPastEnd: 0.5,
    useWorker: false
});
editor.$blockScrolling = Infinity;

var isSettingValue = false;
var lastSetCode = null;
var pendingSetCode = null;
var editorReady = false;

function safeSetCode(code) {
    if (!editorReady) {
        pendingSetCode = code;
        return;
    }
    if (code === lastSetCode && editor.getValue() === code) return;
    isSettingValue = true;
    lastSetCode = code;
    var sel = null;
    try { sel = editor.session.selection.toJSON(); } catch(e){}
    editor.setValue(code, -1);
    try {
        if (sel) editor.session.selection.fromJSON(sel);
    } catch(e){}
    // FIX blank when container was hidden (weight 0) — must resize + updateFull after setValue
    try {
        editor.resize();
        editor.renderer.updateFull();
    } catch(e){}
    isSettingValue = false;
    setTimeout(function(){ focusEditor(); try{editor.resize(); editor.renderer.updateFull();}catch(e){} }, 50);
}

editor.on("change", function() {
    if (!isSettingValue && window.ZCODE) {
        var cur = editor.getValue();
        // update lastSetCode to avoid loop when Kotlin pushes same code
        if (cur !== lastSetCode) {
            window.ZCODE.onCodeChange(cur);
        }
    }
});

// Focus handling for mobile
function focusEditor() {
    editor.focus();
    try { editor.textInput.focus(); } catch(e){}
}
document.getElementById("editor").addEventListener("click", focusEditor);
document.getElementById("editor").addEventListener("touchstart", function(e){
    // prevent default handled by Ace? just focus
    setTimeout(focusEditor, 10);
}, {passive: true});

window.addEventListener("resize", function(){ editor.resize(); });

// Kotlin bridge
function setCode(code) { safeSetCode(code); }
function getCode() { return editor.getValue(); }
function insertText(text) {
    focusEditor();
    editor.insert(text);
    focusEditor();
}
function undo(){ editor.undo(); focusEditor(); }
function redo(){ editor.redo(); focusEditor(); }

function duplicateRows() {
    focusEditor();
    var doc = editor.session.getDocument();
    var sel = editor.getSelection();
    var range = sel.getRange();
    var start = range.start.row;
    var end = range.end.row;
    if (start === end && sel.isEmpty()) {
        var line = doc.getLine(start);
        editor.session.insert({row: start+1, column:0}, line + "\n");
        editor.gotoLine(start+2, 0, false);
    } else {
        var lines = doc.getLines(start, end);
        if (!lines.length) return;
        editor.session.insert({row: end+1, column:0}, lines.join("\n") + "\n");
        editor.gotoLine(end+2, 0, false);
    }
}
function toggleCommentLines() {
    focusEditor();
    var doc = editor.session.getDocument();
    var sel = editor.getSelection();
    var range = sel.getRange();
    var start = range.start.row;
    var end = range.end.row;
    if (sel.isEmpty()) end = start;
    var lines = doc.getLines(start, end);
    if (!lines.length) { lines = [doc.getLine(start)]; end = start; }
    var allCommented = lines.every(function(l){ return /^\s*#/.test(l); });
    var out = lines.map(function(l){
        if (allCommented) return l.replace(/^(\s*)#\s?/, "$1");
        var m = l.match(/^(\s*)/);
        var indent = m ? m[1] : "";
        var trimmed = l.replace(/^\s*/, "");
        if (!trimmed) return indent + "# ";
        return indent + "# " + trimmed;
    });
    var last = doc.getLine(end);
    var replaceRange = {start:{row:start,column:0}, end:{row:end,column:last.length}};
    editor.session.replace(replaceRange, out.join("\n"));
    sel.setRange({start:{row:start,column:0}, end:{row:start+out.length-1,column:out[out.length-1].length}});
}

// Called from Kotlin when WebView ready
function onWebViewReady() {
    editorReady = true;
    try {
        editor.resize();
        editor.renderer.updateFull();
    } catch(e){}
    if (pendingSetCode !== null) {
        var code = pendingSetCode;
        pendingSetCode = null;
        safeSetCode(code);
    } else {
        // even if no pending, ensure current value rendered
        try { editor.resize(); editor.renderer.updateFull(); } catch(e){}
    }
    focusEditor();
    // second resize after delay to handle Compose weight measurement finishing late (0px -> real height)
    setTimeout(function(){ try{editor.resize(); editor.renderer.updateFull();}catch(e){} }, 200);
    setTimeout(function(){ try{editor.resize(); editor.renderer.updateFull(); focusEditor();}catch(e){} }, 600);
}

// debounce 100ms note for test
var debounce_note = "debounce 100ms ZMUX lesson";
</script>
</body>
</html>
